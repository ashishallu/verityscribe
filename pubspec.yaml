name: verity_scribe
description: Premium AI clinical companion frontend prototype.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  pdf: ^3.11.1
  http: ^1.2.2
  supabase_flutter: ^2.8.3
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/verityscribe_app_icon.png
  adaptive_icon_background: "#F8FAFC"
  adaptive_icon_foreground: assets/icon/verityscribe_app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon/verityscribe_app_icon.png
