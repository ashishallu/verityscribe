name: verity_scribe_doctor
description: Companion clinical workspace for VerityScribe doctors.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  supabase_flutter: ^2.8.3
  flutter_riverpod: ^2.5.1
  record: ^6.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/verityscribe_doctor_icon.png
  adaptive_icon_background: '#F6F9FC'
  adaptive_icon_foreground: assets/icon/verityscribe_doctor_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon/verityscribe_doctor_icon.png
