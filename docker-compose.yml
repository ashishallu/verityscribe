services:
  api:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
  admin-portal:
    image: node:20-alpine
    working_dir: /app
    volumes: ["./admin_portal:/app"]
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev"
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
